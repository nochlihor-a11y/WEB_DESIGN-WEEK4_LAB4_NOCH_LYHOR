<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<title>Homework - Layout (CSS Grid version)</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    padding: 2em;
    background: #f4f4f4;
  }

  .container {
    display: grid;
    grid-template-columns: 1fr 10em;
    gap: 1em;
  }

  .left {
    background: #a8d8ff;
    height: 320px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }

  .right {
    display: grid;
    grid-template-rows: repeat(3, 100px);
    gap: 1em;
  }

  .right .box {
    background: #ffcf86;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }
</style>
</head>
<body>

  <div class="container">
    <div class="left">Left (fill remaining space)</div>
    <div class="right">
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box">Box 3</div>
    </div>
  </div>

</body>
</html>
